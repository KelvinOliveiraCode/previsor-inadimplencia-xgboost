[project]
name = "previsor-inadimplencia-xgboost"
version = "0.1.0"
description = "Previsão de inadimplência com XGBoost e explicabilidade SHAP (crédito/risco)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kelvin Oliveira" }]
license = { text = "MIT" }
dependencies = [
    "xgboost>=1.7.0",
    "shap>=0.43.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
previsor-inadimplencia = "previsor_inadimplencia.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
